# booking-fill-tool — 轻量服务器一键部署
# 用法：服务器上 docker compose up -d --build
# 说明：
#   - 数据落在命名卷 booking_data（/data），SKU 库/图片/规则/配置重部署不丢
#   - 首次启动自动从镜像拷贝种子数据到 /data
#   - 上线前务必在 .env 里设置 APP_PASSWORD（公网必设，否则裸奔）
services:
  booking-fill-tool:
    build: .
    image: booking-fill-tool:latest
    container_name: booking-fill-tool
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:8000"   # 宿主机 8002 → 容器 8000（改 80 可免端口访问）
    environment:
      - DATA_DIR=/data
      - PORT=8000
      - APP_PASSWORD=${APP_PASSWORD:-}   # 必须通过 .env 设置强密码
    volumes:
      - booking_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  booking_data:
