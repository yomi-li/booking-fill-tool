# booking-fill-tool — 轻量服务器自动部署（最终版）
# 触发：push 到 main 分支
# 流程：GitHub Actions 通过 SSH 密码登录服务器 → 在服务器上拉代码 → Docker 重建
#
# Secrets 配置：
#   SERVER_HOST     服务器公网 IP
#   SERVER_USER     ubuntu
#   SERVER_PASSWORD 服务器登录密码
#   SERVER_PORT     22
#
name: Deploy to Lightweight Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 唯一一步：SSH 登录服务器，在服务器内完成所有操作
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 25m
          script: |
            set -e
            cd /opt/booking-fill-tool

            echo "=== Step 1: 拉取最新代码 ==="
            # 方法A：直接 git fetch（网络好的时候能用）
            GIT_RESULT=0
            timeout 60 git fetch origin main 2>/dev/null && git reset --hard origin/main || GIT_RESULT=1

            if [ $GIT_RESULT -ne 0 ]; then
              echo "git fetch 失败，改用下载方式..."
              # 方法B：通过 GitHub API 下载 tarball（走不同的网络路径）
              cd /tmp
              # 用 wget 重试机制下载
              wget --tries=3 --timeout=30 \
                -O deploy.tar.gz \
                "https://github.com/yomi-li/booking-fill-tool/archive/refs/heads/main.tar.gz" \
              && cd /opt/booking-fill-tool \
              && tar xzf /tmp/deploy.tar.gz --strip-components=1 --overwrite \
              && rm -f /tmp/deploy.tar.gz \
              && echo "=== 代码下载成功 ==="
            fi

            echo "=== Step 2: 重建 Docker 容器 ==="
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null 2>&1 || true

            echo "deploy done: $(date)"
