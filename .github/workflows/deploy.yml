# booking-fill-tool — 轻量服务器自动部署（最终版 v4）
# 触发：push 到 main 分支
# 流程：GitHub Actions 打包代码 → SCP推送到服务器(密钥认证) → SSH重建容器(密钥认证)
#
# Secrets（注意名字必须完全匹配）：
#   SERVER_HOST     服务器公网 IP
#   SERVER_USER     ubuntu
#   SERVER_SSH_KEY  服务器私钥
#   SERVER_PORT     22
#
name: Deploy to Lightweight Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Step 1: 打包代码
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package code
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='_samples/' --exclude='_old_*' \
            --exclude='*.log' --exclude='.env' \
            .

      # Step 2: SCP 推送到服务器（用 SSH 密钥认证，#4-#6 已验证可用）
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "/tmp/deploy.tar.gz"
          target: "/opt/booking-fill-tool/"

      # Step 3: SSH 到服务器解压 + 重建容器（同样用密钥认证）
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 25m
          script: |
            set -e
            cd /opt/booking-fill-tool
            tar xzf deploy.tar.gz --overwrite
            rm -f deploy.tar.gz
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null 2>&1 || true
            echo "deploy done: $(date)"
